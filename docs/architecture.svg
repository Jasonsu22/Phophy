<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
    <marker id="arrowCloud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <style>
      .title { font-size: 13px; font-weight: 700; fill: #1d1d1f; }
      .sub { font-size: 10.5px; fill: #4a5160; }
      .small { font-size: 9.5px; fill: #6b7280; }
      .zone { font-size: 13px; font-weight: 700; }
      .line { stroke: #5b6475; stroke-width: 1.4; fill: none; }
      .cloudline { stroke: #b7791f; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- Zones -->
  <rect x="10" y="10" width="540" height="540" rx="18" fill="#f4f7fc" stroke="#c6d2e6" stroke-width="1.5"/>
  <text x="28" y="34" class="zone" fill="#1f3b6e">On the iPhone</text>
  <text x="128" y="34" class="small">private · free · works offline</text>

  <rect x="570" y="10" width="180" height="540" rx="18" fill="#fffaf0" stroke="#e2b55f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="586" y="34" class="zone" fill="#8a5a12">Cloud (optional)</text>
  <text x="586" y="50" class="small">only when you ask</text>

  <!-- Photo library -->
  <rect x="30" y="58" width="170" height="64" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
  <text x="115" y="84" class="title" text-anchor="middle">Photo library</text>
  <text x="115" y="102" class="sub" text-anchor="middle">PhotoKit · iCloud Photos</text>

  <!-- Indexer -->
  <rect x="240" y="58" width="290" height="64" rx="10" fill="#e8f0ff" stroke="#7d9ad1"/>
  <text x="385" y="80" class="title" text-anchor="middle">Background indexer</text>
  <text x="385" y="97" class="sub" text-anchor="middle">metadata · text (OCR) · labels · MobileCLIP vector</text>
  <text x="385" y="112" class="small" text-anchor="middle">pauses while you scroll, view a photo, or the phone is hot</text>
  <line x1="200" y1="90" x2="238" y2="90" class="line" marker-end="url(#arrow)"/>

  <!-- Index -->
  <rect x="30" y="152" width="500" height="58" rx="10" fill="#eef1f5" stroke="#9aa3b2"/>
  <text x="280" y="176" class="title" text-anchor="middle">Local index (SQLite)</text>
  <text x="280" y="195" class="sub" text-anchor="middle">text · labels · embeddings · categories · lecture notes</text>
  <line x1="385" y1="122" x2="385" y2="150" class="line" marker-end="url(#arrow)"/>

  <!-- Features -->
  <g>
    <rect x="30" y="244" width="113" height="72" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
    <text x="86.5" y="268" class="title" text-anchor="middle">Search</text>
    <text x="86.5" y="286" class="sub" text-anchor="middle">keyword + visual</text>
    <text x="86.5" y="301" class="sub" text-anchor="middle">results merged</text>

    <rect x="159" y="244" width="113" height="72" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
    <text x="215.5" y="268" class="title" text-anchor="middle">Collections</text>
    <text x="215.5" y="286" class="sub" text-anchor="middle">categories</text>
    <text x="215.5" y="301" class="sub" text-anchor="middle">similar photos</text>

    <rect x="288" y="244" width="113" height="72" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
    <text x="344.5" y="268" class="title" text-anchor="middle">Study</text>
    <text x="344.5" y="286" class="sub" text-anchor="middle">lecture notes</text>
    <text x="344.5" y="301" class="sub" text-anchor="middle">flashcards</text>

    <rect x="417" y="244" width="113" height="72" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
    <text x="473.5" y="268" class="title" text-anchor="middle">Viewer &amp; editor</text>
    <text x="473.5" y="286" class="sub" text-anchor="middle">adjust · looks</text>
    <text x="473.5" y="301" class="sub" text-anchor="middle">crop · subject</text>

    <line x1="86.5" y1="210" x2="86.5" y2="242" class="line" marker-end="url(#arrow)"/>
    <line x1="215.5" y1="210" x2="215.5" y2="242" class="line" marker-end="url(#arrow)"/>
    <line x1="344.5" y1="210" x2="344.5" y2="242" class="line" marker-end="url(#arrow)"/>
    <line x1="473.5" y1="210" x2="473.5" y2="242" class="line" marker-end="url(#arrow)"/>
  </g>

  <!-- Assistant -->
  <rect x="30" y="354" width="300" height="72" rx="10" fill="#f1ebff" stroke="#9b85d6"/>
  <text x="180" y="378" class="title" text-anchor="middle">AI assistant</text>
  <text x="180" y="396" class="sub" text-anchor="middle">understands the question, then calls tools:</text>
  <text x="180" y="411" class="small" text-anchor="middle">search · by date · collections · show photos · make album</text>
  <line x1="86.5" y1="352" x2="86.5" y2="318" class="line" marker-end="url(#arrow)"/>
  <line x1="215.5" y1="352" x2="215.5" y2="318" class="line" marker-end="url(#arrow)"/>

  <!-- On-device model -->
  <rect x="350" y="354" width="180" height="72" rx="10" fill="#f1ebff" stroke="#9b85d6"/>
  <text x="440" y="378" class="title" text-anchor="middle">Apple Intelligence</text>
  <text x="440" y="396" class="sub" text-anchor="middle">on-device model</text>
  <text x="440" y="411" class="small" text-anchor="middle">if the phone has it, else cloud</text>
  <line x1="332" y1="390" x2="348" y2="390" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="372" y1="318" x2="400" y2="352" class="line" marker-end="url(#arrow)"/>

  <!-- You -->
  <rect x="30" y="456" width="500" height="50" rx="10" fill="#ffffff" stroke="#9fb0cc"/>
  <text x="280" y="478" class="title" text-anchor="middle">You</text>
  <text x="280" y="495" class="sub" text-anchor="middle">ask bar · chat · browsing and editing</text>
  <line x1="180" y1="454" x2="180" y2="428" class="line" marker-end="url(#arrow)"/>

  <text x="30" y="532" class="small">Anything that changes the library (albums, edits, deletes) asks you first.</text>

  <!-- Cloud services -->
  <rect x="585" y="244" width="150" height="72" rx="10" fill="#ffffff" stroke="#e2b55f"/>
  <text x="660" y="268" class="title" text-anchor="middle">AI image service</text>
  <text x="660" y="286" class="sub" text-anchor="middle">OpenAI · Gemini · custom</text>
  <text x="660" y="301" class="small" text-anchor="middle">generative edits, opt-in</text>
  <line x1="532" y1="280" x2="583" y2="280" class="cloudline" marker-end="url(#arrowCloud)"/>

  <rect x="585" y="354" width="150" height="72" rx="10" fill="#ffffff" stroke="#e2b55f"/>
  <text x="660" y="378" class="title" text-anchor="middle">Cloud model</text>
  <text x="660" y="396" class="sub" text-anchor="middle">Claude · OpenAI · custom</text>
  <text x="660" y="411" class="small" text-anchor="middle">receives text, never photos</text>
  <line x1="532" y1="390" x2="583" y2="390" class="cloudline" marker-end="url(#arrowCloud)"/>

  <text x="586" y="486" class="small">API keys stay in the</text>
  <text x="586" y="500" class="small">iPhone's Keychain and go</text>
  <text x="586" y="514" class="small">only to their own provider.</text>
</svg>
