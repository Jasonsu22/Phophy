<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Phophy: your photos, understood">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="360" rx="36"/></clipPath>
    <clipPath id="tile"><rect width="200" height="200" rx="46"/></clipPath>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="#131a44"/>
    <g filter="url(#blur)">
      <circle cx="220" cy="80" r="200" fill="#5a3fd6">
        <animate attributeName="cx" values="220;360;220" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="200" r="210" fill="#0f8f9c">
        <animate attributeName="cx" values="1000;860;1000" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;120;200" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="380" r="220" fill="#b4366f">
        <animate attributeName="cx" values="620;740;620" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="360" fill="#0c1030" opacity="0.25"/>

    <!-- floating photo cards -->
    <g opacity="0.9">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
        <rect x="860" y="70" width="120" height="90" rx="14" fill="#f4f5f9" transform="rotate(-8 920 115)"/>
        <rect x="874" y="84" width="60" height="8" rx="4" fill="#2a3270" transform="rotate(-8 920 115)"/>
        <rect x="874" y="102" width="88" height="5" rx="2.5" fill="#c3c9dd" transform="rotate(-8 920 115)"/>
        <rect x="874" y="114" width="70" height="5" rx="2.5" fill="#c3c9dd" transform="rotate(-8 920 115)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="7s" repeatCount="indefinite"/>
        <rect x="990" y="150" width="130" height="100" rx="14" fill="#3f8f6a" transform="rotate(7 1055 200)"/>
        <rect x="990" y="150" width="130" height="52" rx="14" fill="#8ec5ee" transform="rotate(7 1055 200)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="8s" repeatCount="indefinite"/>
        <rect x="880" y="215" width="110" height="95" rx="14" fill="#d94f3b" transform="rotate(-4 935 262)"/>
        <rect x="880" y="215" width="110" height="45" rx="14" fill="#f3a65a" transform="rotate(-4 935 262)"/>
      </g>
    </g>

    <!-- logo -->
    <g transform="translate(80 92) scale(0.88)">
      <g clip-path="url(#tile)">
        <rect width="200" height="200" fill="#2a2f8f"/>
        <circle cx="158" cy="34" r="74" fill="#5a3fd6"/>
        <circle cx="30" cy="190" r="70" fill="#0f8f9c"/>
      </g>
      <rect x="54" y="46" width="24" height="112" rx="12" fill="#ffffff"/>
      <circle cx="110" cy="86" r="34" fill="none" stroke="#ffffff" stroke-width="24"/>
      <circle cx="110" cy="86" r="11" fill="#8fe3ea">
        <animate attributeName="r" values="11;14;11" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="290" y="175" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" fill="#ffffff" letter-spacing="-2">Phophy</text>
    <text x="294" y="228" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="url(#fade)">Your photos, understood. On your iPhone.</text>
    <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">
      <rect x="292" y="258" width="134" height="36" rx="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="359" y="282" text-anchor="middle">Search</text>
      <rect x="436" y="258" width="134" height="36" rx="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="503" y="282" text-anchor="middle">Organize</text>
      <rect x="580" y="258" width="134" height="36" rx="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="647" y="282" text-anchor="middle">Study</text>
    </g>
  </g>
</svg>
